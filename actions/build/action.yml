name: Build candidate
description: Build one native platform without publishing
inputs:
  context:
    default: '.'
    description: Build context
  file:
    default: Dockerfile
    description: Dockerfile path
  platform:
    default: linux/amd64
    description: Native target platform
  target:
    default: ''
    description: Optional build stage
  image:
    default: candidate:gate
    description: Local candidate tag
  build-args:
    default: ''
    description: Docker build arguments
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platform }}
        target: ${{ inputs.target }}
        build-args: ${{ inputs.build-args }}
        tags: ${{ inputs.image }}
        load: true
        push: false
        pull: true
        no-cache: true
        provenance: false
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=sha-${{ github.sha }}-r${{ github.run_id }}-${{ github.run_attempt }}
