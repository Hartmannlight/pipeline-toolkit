name: Publish tested candidate
description: Publish exact tested image and attest its provenance and SBOM
inputs:
  image:
    description: Full GHCR image name
    required: true
  candidate:
    description: Local tested image tag
    default: candidate:gate
  sbom:
    description: SBOM file
    default: artifacts/sbom.spdx.json
  token:
    description: Registry token
    required: true
outputs:
  digest:
    description: Published manifest digest
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        test "$EVENT" != pull_request
        test "$EVENT" != pull_request_target
        if [[ "$REF" != "refs/heads/$DEFAULT_BRANCH" && "$REF" != refs/tags/v* ]]; then
          echo 'Publishing requires the default branch or a version tag' >&2
          exit 1
        fi
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: push
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CANDIDATE: ${{ inputs.candidate }}
      run: |
        immutable="$IMAGE:sha-$GITHUB_SHA-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        docker tag "$CANDIDATE" "$immutable"
        docker push "$immutable"
        digest=$(docker buildx imagetools inspect "$immutable" --format '{{json .Manifest.Digest}}' | tr -d '"')
        [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Published $immutable@$digest" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
    - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        sbom-path: ${{ inputs.sbom }}
        push-to-registry: true
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.push.outputs.digest }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:latest" "$IMAGE@$DIGEST"
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$DIGEST"
        fi
