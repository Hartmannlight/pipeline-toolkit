name: Publish tested candidate
description: Publish exact tested image and attest its provenance and SBOM
inputs:
  image:
    description: Full GHCR image name
    required: true
  candidate:
    description: Local tested image tag
    default: candidate:gate
  sbom:
    description: SBOM file
    default: artifacts/sbom.spdx.json
  token:
    description: Registry token
    required: true
outputs:
  digest:
    description: Published manifest digest
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
  - shell: bash
    env:
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    run: |
      test "$EVENT" != pull_request
      test "$EVENT" != pull_request_target
      if [[ "$REF" != "refs/heads/$DEFAULT_BRANCH" && "$REF" != refs/tags/v* ]]; then
        echo 'Publishing requires the default branch or a version tag' >&2
        exit 1
      fi
  - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ inputs.token }}
  - id: push
    shell: bash
    env:
      IMAGE: ${{ inputs.image }}
      CANDIDATE: ${{ inputs.candidate }}
      PUBLISH_ACTION_PATH: ${{ github.action_path }}
    run: bash "$PUBLISH_ACTION_PATH/push.sh"
  - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
    with:
      subject-name: ${{ inputs.image }}
      subject-digest: ${{ steps.push.outputs.digest }}
      push-to-registry: true
    if: '!github.event.repository.private'
  - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
    with:
      subject-name: ${{ inputs.image }}
      subject-digest: ${{ steps.push.outputs.digest }}
      sbom-path: ${{ inputs.sbom }}
      push-to-registry: true
    if: '!github.event.repository.private'
  - if: github.event.repository.private
    uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
  - if: github.event.repository.private
    shell: bash
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ steps.push.outputs.digest }}
      SBOM: ${{ inputs.sbom }}
    run: |
      python3 - <<'PY'
      import json, os
      from pathlib import Path
      predicate = {'builder': {'id': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions'}, 'buildType': 'https://github.com/Hartmannlight/pipeline-toolkit', 'invocation': {'configSource': {'uri': 'git+https://github.com/' + os.environ['GITHUB_REPOSITORY'], 'digest': {'sha1': os.environ['GITHUB_SHA']}}}}
      Path(os.environ['RUNNER_TEMP'], 'provenance.json').write_text(json.dumps(predicate))
      PY
      cosign attest --yes --type slsaprovenance --predicate "$RUNNER_TEMP/provenance.json" "$IMAGE@$DIGEST"
      cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE@$DIGEST"
  - shell: bash
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ steps.push.outputs.digest }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    run: |
      if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
        docker buildx imagetools create --prefer-index=false -t "$IMAGE:latest" "$IMAGE@$DIGEST"
      elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
        docker buildx imagetools create --prefer-index=false -t "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$DIGEST"
      fi
